name: run

# 第2版（DESIGN.md 9.2）：計画（1台）→ 書き出し（同時3台）→ 仕上げ（1台）
on:
  repository_dispatch:
    types: [stream_offline]  # 配信終了の通知（Cloudflare Workers 経由）で即時に起動
  schedule:
    - cron: "17 */6 * * *"   # 6時間おき。通知を取りこぼしたときの保険
  workflow_dispatch:
    inputs:
      vod_id:
        description: "TwitchのVOD ID（数字だけ）。空なら自動検知モード"
        required: false
        default: ""
      youtube:
        description: "VODを指定したとき、YouTubeにも上げる（同じVODのやり直しでは false に）"
        type: boolean
        required: false
        default: false
      singles:
        description: "単体動画の本数（空なら設定どおり）"
        required: false
        default: ""
      shorts:
        description: "ショートの本数（空なら設定どおり。0で作らない）"
        required: false
        default: ""
      prefer_game:
        description: "単体動画で優先する言葉（ゲーム名かタイトル。カンマ区切り、例：BLEACH,ALGS。空なら面白さの順）"
        required: false
        default: ""
      add:
        description: "足し算：作った動画はそのままで、足す話題の番号（例 4,5）。Claudeは呼ばない"
        required: false
        default: ""
      drop:
        description: "足し算：取りやめる上げ直し待ち（例 shorts/short_01.mp4）"
        required: false
        default: ""
      extra:
        description: "足し算：区間を手で決めた話題。開始-終了|タイトル|サムネの言葉|概要欄の一言（; 区切りで複数）"
        required: false
        default: ""

# GitHubは同じグループの順番待ちを1つしか持てず、古い順番待ちは取り消される。
# 自動処理（通知・定期・VOD指定なし）は1つのグループ、VODを指定した手動実行はVODごとのグループに分ける。
concurrency:
  group: ${{ inputs.vod_id && format('kirinuki-vod-{0}', inputs.vod_id) || 'kirinuki-auto' }}
  cancel-in-progress: false

permissions:
  contents: write   # state/processed.json のコミット
  actions: write    # 未処理の配信が残っていれば次の実行を起動する

env:
  TWITCH_DOWNLOADER_VERSION: "1.56.5"
  # RCLONE_ で始まる環境変数は rclone が自分のオプションとして読むので、別名にする
  TOOL_RCLONE_VERSION: "v1.75.2"
  # 自動処理（VOD指定なし）は常に YouTube に上げる。手動でVODを指定したときは入力で決める
  UPLOAD_YOUTUBE: ${{ (inputs.vod_id == '' || inputs.vod_id == null || inputs.youtube || inputs.add != '' || inputs.drop != '' || inputs.extra != '') && 'true' || 'false' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      has_work: ${{ steps.plan.outputs.has_work }}
      vod_id: ${{ steps.plan.outputs.vod_id }}
      items: ${{ steps.plan.outputs.items }}
      more: ${{ steps.plan.outputs.more }}
    steps:
      # 起動した時点ではなく、いまの main を取る（順番待ちの間に別の実行が処理済みの記録を足していることがある）
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: ツールを入れる
        run: |
          for i in 1 2 3; do timeout 180 sudo apt-get update -q -o Acquire::Retries=3 -o Acquire::http::Timeout=20 && break; echo "apt-get update をやり直し（$i）"; sleep 10; done
          timeout 600 sudo apt-get install -y -q -o Acquire::Retries=3 ffmpeg
          curl -fsSL -o /tmp/tdcli.zip \
            "https://github.com/lay295/TwitchDownloader/releases/download/${TWITCH_DOWNLOADER_VERSION}/TwitchDownloaderCLI-${TWITCH_DOWNLOADER_VERSION}-Linux-x64.zip"
          sudo mkdir -p /opt/tdcli && sudo unzip -o -q /tmp/tdcli.zip -d /opt/tdcli
          sudo chmod +x /opt/tdcli/TwitchDownloaderCLI
          sudo ln -sf /opt/tdcli/TwitchDownloaderCLI /usr/local/bin/TwitchDownloaderCLI
          pip install -q -r requirements.txt -e .
      - name: 文字起こしモデルのキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-v1
      - name: テスト
        run: pytest -q
      # 足し算は前回の記録（metadata.json）をドライブから読む
      - name: rclone の設定（足し算のときだけ）
        if: inputs.add != '' || inputs.drop != ''
        env:
          RCLONE_CONFIG_TEXT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          curl -fsSL -o /tmp/rclone.deb \
            "https://github.com/rclone/rclone/releases/download/${TOOL_RCLONE_VERSION}/rclone-${TOOL_RCLONE_VERSION}-linux-amd64.deb"
          sudo dpkg -i /tmp/rclone.deb
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONFIG_TEXT" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
      - name: 配信終了の通知なら、アーカイブの確定を5分待つ
        if: github.event_name == 'repository_dispatch'
        run: sleep 300
      - name: 計画
        id: plan
        env:
          VOD_ID: ${{ inputs.vod_id }}
          KIRINUKI_SINGLES: ${{ inputs.singles }}
          KIRINUKI_SHORTS: ${{ inputs.shorts }}
          KIRINUKI_PREFER_GAME: ${{ inputs.prefer_game }}
          ADD: ${{ inputs.add }}
          DROP: ${{ inputs.drop }}
          EXTRA: ${{ inputs.extra }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          if [ -n "$ADD$DROP$EXTRA" ]; then python -m kirinuki plan --vod-id "$VOD_ID" --add "$ADD" --drop "$DROP" --extra "$EXTRA"
          elif [ -n "$VOD_ID" ]; then python -m kirinuki plan --vod-id "$VOD_ID"; else python -m kirinuki plan; fi
      - name: 計画を次の段に渡す
        if: steps.plan.outputs.has_work == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: plan
          path: |
            work/${{ steps.plan.outputs.vod_id }}/plan.json
            work/${{ steps.plan.outputs.vod_id }}/chat.json
          retention-days: 2
      - name: 後片付け
        if: always()
        run: rm -rf ~/.config/rclone/rclone.conf

  # 新しい配信がないとき：上げ直し待ちを空いた枠で上げる（6時間おきの見回りで動く）
  retry:
    needs: plan
    if: needs.plan.outputs.has_work != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: ツールを入れる
        run: |
          curl -fsSL -o /tmp/rclone.deb \
            "https://github.com/rclone/rclone/releases/download/${TOOL_RCLONE_VERSION}/rclone-${TOOL_RCLONE_VERSION}-linux-amd64.deb"
          sudo dpkg -i /tmp/rclone.deb
          pip install -q -r requirements.txt -e .
      - name: rclone の設定
        env:
          RCLONE_CONFIG_TEXT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONFIG_TEXT" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
      - name: 上げ直し
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m kirinuki retry
      - name: 記録をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/processed.json state/uploads.json state/uploads_shorts.json
          if git diff --cached --quiet; then echo "記録の変更なし"; exit 0; fi
          git commit -m "上げ直しの記録を更新"
          for i in 1 2 3; do git pull --rebase --autostash -q && git push -q && exit 0; sleep 5; done
          exit 1
      - name: 後片付け
        if: always()
        run: rm -rf work ~/.config/rclone/rclone.conf

  render:
    needs: plan
    if: needs.plan.outputs.has_work == 'true' && needs.plan.outputs.items != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        item: ${{ fromJSON(needs.plan.outputs.items) }}
    steps:
      # 起動した時点ではなく、いまの main を取る（順番待ちの間に別の実行が処理済みの記録を足していることがある）
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: ツールを入れる
        run: |
          for i in 1 2 3; do timeout 180 sudo apt-get update -q -o Acquire::Retries=3 -o Acquire::http::Timeout=20 && break; echo "apt-get update をやり直し（$i）"; sleep 10; done
          timeout 600 sudo apt-get install -y -q -o Acquire::Retries=3 ffmpeg fonts-noto-cjk fonts-noto-cjk-extra
          curl -fsSL -o /tmp/rclone.deb \
            "https://github.com/rclone/rclone/releases/download/${TOOL_RCLONE_VERSION}/rclone-${TOOL_RCLONE_VERSION}-linux-amd64.deb"
          sudo dpkg -i /tmp/rclone.deb
          pip install -q -r requirements.txt -r requirements-thumb.txt -e .
          ffmpeg -hide_banner -filters | grep -q " ass " || { echo "ffmpeg に libass が無い"; exit 1; }
          fc-list | grep -q "Noto Sans CJK JP Black" || { echo "Noto Sans CJK JP Black が無い"; exit 1; }
      - name: 顔切り抜きモデルのキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-u2net-human-seg-v1
      - name: rclone の設定
        env:
          RCLONE_CONFIG_TEXT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONFIG_TEXT" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: work/${{ needs.plan.outputs.vod_id }}
      - name: 書き出し
        env:
          VOD_ID: ${{ needs.plan.outputs.vod_id }}
          ITEM: ${{ matrix.item }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          args=(render-item --vod-id "$VOD_ID" --item "$ITEM")
          if [ "$UPLOAD_YOUTUBE" = "true" ]; then args+=(--youtube); fi
          python -m kirinuki "${args[@]}"
      - name: 結果を仕上げの段に渡す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.item }}
          path: work/${{ needs.plan.outputs.vod_id }}/results/
          if-no-files-found: ignore
          retention-days: 2
      - name: 後片付け
        if: always()
        run: rm -rf work ~/.config/rclone/rclone.conf

  finalize:
    needs: [plan, render]
    if: always() && needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # 起動した時点ではなく、いまの main を取る（順番待ちの間に別の実行が処理済みの記録を足していることがある）
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: ツールを入れる
        run: |
          curl -fsSL -o /tmp/rclone.deb \
            "https://github.com/rclone/rclone/releases/download/${TOOL_RCLONE_VERSION}/rclone-${TOOL_RCLONE_VERSION}-linux-amd64.deb"
          sudo dpkg -i /tmp/rclone.deb
          pip install -q -r requirements.txt -e .
      - name: rclone の設定
        env:
          RCLONE_CONFIG_TEXT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONFIG_TEXT" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: work/${{ needs.plan.outputs.vod_id }}
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: work/${{ needs.plan.outputs.vod_id }}/results
          merge-multiple: true
      - name: 仕上げ
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          VOD_ID: ${{ needs.plan.outputs.vod_id }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m kirinuki finalize --vod-id "$VOD_ID"
      - name: 処理済みの記録をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/processed.json state/uploads.json state/uploads_shorts.json
          if git diff --cached --quiet; then echo "記録の変更なし"; exit 0; fi
          git commit -m "処理済みの記録を更新"
          for i in 1 2 3; do git pull --rebase --autostash -q && git push -q && exit 0; sleep 5; done
          exit 1
      - name: 未処理の配信が残っていれば、次の実行を起動する
        if: needs.plan.outputs.more != '0' && needs.plan.outputs.more != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run run.yml --repo "$GITHUB_REPOSITORY"
      - name: 後片付け
        if: always()
        run: rm -rf work ~/.config/rclone/rclone.conf
