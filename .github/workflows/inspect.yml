name: inspect

# 上がった動画の中身を確かめる：元配信の指定区間の、1分ごとのチャットと文字起こし（small）をログに出す。
# タイトルの付け直しなどに使う。動画は作らない。
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "チャットを借りる run.yml の実行ID"
        required: true
      vod_id:
        description: "元配信の VOD ID"
        required: true
      start:
        description: "開始（元配信の秒）"
        required: true
      end:
        description: "終了（元配信の秒）"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: ツールを入れる
        run: |
          for i in 1 2 3; do timeout 180 sudo apt-get update -q -o Acquire::Retries=3 -o Acquire::http::Timeout=20 && break; echo "apt-get update をやり直し（$i）"; sleep 10; done
          timeout 600 sudo apt-get install -y -q -o Acquire::Retries=3 ffmpeg
          pip install -q -r requirements.txt -e .
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: work
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: チャットと文字起こしを出す
        env:
          VOD_ID: ${{ inputs.vod_id }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from kirinuki import chat, comments, timeline
          from kirinuki.config import load_config
          from kirinuki.fetch import fetch_audio
          from kirinuki.transcribe import format_lines, transcribe_all
          vod, a, b = os.environ["VOD_ID"], float(os.environ["START"]), float(os.environ["END"])
          cfg = load_config()
          c = chat.load_chat(Path("work/chat.json"), vod)
          ng = comments.load_ng_words(cfg.ng_words_path())
          msgs = [m for m in c.messages if a <= m.offset_sec < b + 30]
          print("== チャット（1分ごと）")
          print("\n".join(timeline.minute_lines(msgs, c.video, ng, top_k=10, max_chars=30)[int(a // 60): int(b // 60) + 1]))
          seg = fetch_audio(vod, a, b, Path("work/audio"), "inspect", c.video.length_sec)
          print("== 文字起こし（small）")
          print(format_lines(transcribe_all({0: seg}, "small", cfg.whisper.compute_type)[0]))
          PY
